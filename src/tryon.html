<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a2818">
<title>AI 试摆 - 银杏家具</title>
<style>
:root{--ink:#1a1a1a;--ink2:#3a3a3a;--paper:#fafaf7;--coffee:#3a2818;--red:#d94f3e;--green:#34C759}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);font-size:1rem;line-height:1.6;padding-bottom:100px}
a{color:var(--ink);text-decoration:none}

.nav{background:var(--coffee);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.nav-logo{font-size:20px;font-weight:700}

.wrap{padding:24px 20px}

.intro{background:var(--coffee);color:#fff;padding:24px;border-radius:16px;margin-bottom:24px}
.intro h1{font-size:1.75rem;font-weight:800;margin-bottom:12px;line-height:1.3}
.intro p{font-size:1.05rem;opacity:.85}

.form{background:#fff;padding:24px;border-radius:16px;border:1px solid var(--ink)}
.form h2{font-size:1.3rem;font-weight:800;margin-bottom:20px;color:var(--coffee)}
.field{margin-bottom:18px}
.field label{display:block;font-size:1rem;font-weight:600;margin-bottom:8px}
.field input,.field select{
  width:100%;padding:18px;font-size:1.2rem;
  background:var(--paper);border:2px solid var(--ink);border-radius:12px;
  color:var(--ink);font-family:inherit;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--coffee);background:#fff}
.file-field{
  border:2px dashed var(--ink);background:var(--paper);padding:24px;text-align:center;
  border-radius:14px;cursor:pointer;font-size:1.1rem;font-weight:600;
}
.file-field:hover{border-color:var(--coffee);background:#fef8e8}

.submit-btn{
  width:100%;padding:24px;font-size:1.4rem;font-weight:800;
  background:var(--coffee);color:#fff;border-radius:14px;
  margin-top:16px;
}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;gap:10px;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.bottom-bar a{flex:1;text-align:center;padding:20px;border-radius:14px;font-size:1.2rem;font-weight:800}
.bottom-bar .call{background:var(--red);color:#fff}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" style="color:#fff;font-size:18px">← 返回</a>
  <div class="nav-logo">📷 AI 试摆</div>
  <a href="tel:13359140982" style="color:#fff;font-size:18px">📞</a>
</nav>

<div class="wrap">
  <div class="intro">
    <h1>📷 发张照片<br>沙发搬进你家</h1>
    <p>5 分钟出图，免费看效果。<br>老人不会填？直接拨电话让店员帮您。</p>
  </div>

  <form class="form" id="tryonForm">
    <h2>👇 填一下，店员联系您</h2>

    <div class="field">
      <label>称呼 *</label>
      <input name="name" required placeholder="如：李姐">
    </div>

    <div class="field">
      <label>手机号 *</label>
      <input name="phone" type="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}" required placeholder="11位手机号" maxlength="11">
    </div>

    <div class="field">
      <label>想试摆的家具</label>
      <select name="productId" id="prodSelect">
        <option>sofa-1</option>
        <option>sofa-2</option>
        <option>sofa-3</option>
        <option>bed-1</option>
      </select>
    </div>

    <div class="field">
      <label>客厅照片 *</label>
      <label class="file-field">
        <input name="photo" type="file" accept="image/*" capture="environment" required style="display:none" onchange="this.parentNode.querySelector('.fn').textContent=this.files[0]?.name||'点击拍照/选图'">
        <div class="fn">📷 点击拍照或选择图片</div>
      </label>
    </div>

    <button type="submit" class="submit-btn">提交，1小时内联系您 ✓</button>
  </form>
</div>

<div class="bottom-bar">
  <a href="tel:13359140982" class="call">📞 不如直接拨电话</a>
</div>

<script>
fetch('/api/products').then(r=>r.json()).then(d=>{
  const sel = document.getElementById('prodSelect');
  sel.innerHTML = d.products.map(p=>`<option value="${p.id}">${p.name} (${p.subtitle})</option>`).join('');
});

document.getElementById('tryonForm').addEventListener('submit',e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = Object.fromEntries(fd);
  fetch('/api/tryon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:data.productId,roomPhoto:data.photo?.name||'有'})})
    .then(r=>r.json())
    .then(d=>{
      if(d.ok) alert('✅ ' + d.message);
      else alert('❌ ' + (d.error||'失败'));
    });
});
</script>
</body>
</html>
