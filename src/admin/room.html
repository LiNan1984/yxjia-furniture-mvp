<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a2818">
<title>上传顾客客厅图 · 银杏家具后台</title>
<style>
:root{--ink:#1a1a1a;--paper:#faf6ef;--coffee:#3a2818;--red:#d94f3e;--green:#1f7a3a}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);padding-bottom:80px}
.nav{background:var(--coffee);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:16px}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px}
h1{font-size:2rem;color:var(--coffee);margin-bottom:16px}
label{display:block;font-size:1.25rem;margin:24px 0 8px;font-weight:700}
input[type=file]{width:100%;padding:18px;font-size:1.3rem;border:2px solid #c8b89a;border-radius:12px;background:#fff}
button{min-height:64px;width:100%;padding:18px;font-size:1.5rem;font-weight:800;background:var(--coffee);color:#fff;border:none;border-radius:12px;margin-top:24px;cursor:pointer}
.back{display:inline-block;margin-bottom:16px;font-size:1.2rem;color:var(--coffee);text-decoration:none}
.msg{display:none;padding:18px;border-radius:12px;margin-top:18px;font-size:1.2rem;font-weight:700}
.msg.ok{display:block;background:var(--green);color:#fff}
.msg.err{display:block;background:var(--red);color:#fff}
.preview{margin-top:14px;max-width:300px;border-radius:10px;border:2px solid #c8b89a;display:none}
.url{margin-top:14px;font-size:1.1rem;background:#fff;padding:14px;border-radius:10px;border:2px dashed #c8b89a;word-break:break-all}
</style>
</head>
<body>
<header class="nav"><a href="/admin/index">← 返回</a><div style="font-size:1.3rem;font-weight:800">🛋️ 顾客客厅图</div></header>
<main class="wrap">
  <a class="back" href="/admin/index">← 返回后台首页</a>
  <h1>🛋️ 上传顾客客厅图</h1>
  <p style="font-size:1.15rem;color:#444">顾客发来的客厅照片，先存起来，下一步再去 AI 试摆</p>

  <form id="f">
    <label for="file">顾客客厅照片（jpg / png）</label>
    <input id="file" name="file" type="file" accept="image/*" required>
    <img id="preview" class="preview" alt="预览">
    <button type="submit">⬆️ 上传</button>
  </form>

  <div id="msg" class="msg"></div>
  <div id="urlbox" class="url" style="display:none"></div>
</main>

<script>
const f=document.getElementById('f');
const msg=document.getElementById('msg');
const urlbox=document.getElementById('urlbox');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');

fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0];
  if(!f){preview.style.display='none';return}
  const reader=new FileReader();
  reader.onload=e=>{preview.src=e.target.result;preview.style.display='block'};
  reader.readAsDataURL(f);
});

function showMsg(text,ok){
  msg.textContent=text;
  msg.className='msg '+(ok?'ok':'err');
  if(ok){
    msg.style.display='block';
  }
}

f.addEventListener('submit',async e=>{
  e.preventDefault();
  const file=fileInput.files[0];
  if(!file){showMsg('请选择图片',false);return}
  const form=new FormData();
  form.append('file',file);
  try{
    const r=await fetch('/api/upload/room',{method:'POST',body:form});
    const data=await r.json();
    if(!data.success){showMsg(data.error||'上传失败',false);return}
    showMsg('✅ 上传成功',true);
    urlbox.style.display='block';
    urlbox.innerHTML='<b>URL：</b><br>'+data.data.url+'<br><br><img src="'+data.data.url+'" style="max-width:100%;border-radius:10px;margin-top:10px">';
    f.reset();preview.style.display='none';
  }catch(err){showMsg('网络出错，请重试',false)}
});

async function check(){
  const r=await fetch('/api/auth/me');
  const data=await r.json();
  if(!data.success||!data.data||!data.data.user||data.data.user.id!=='admin'){
    location.href='/admin/login';
  }
}
check();
</script>
</body>
</html>
