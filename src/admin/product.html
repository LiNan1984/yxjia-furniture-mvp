<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a2818">
<title>添加新商品 · 银杏家具后台</title>
<style>
:root{--ink:#1a1a1a;--paper:#faf6ef;--coffee:#3a2818;--red:#d94f3e;--green:#1f7a3a}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);padding-bottom:80px}
.nav{background:var(--coffee);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:16px}
.nav a{color:#fff;font-size:1.2rem;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px}
h1{font-size:2rem;color:var(--coffee);margin-bottom:16px}
label{display:block;font-size:1.25rem;margin:24px 0 8px;font-weight:700}
input,select{width:100%;padding:18px;font-size:1.3rem;border:2px solid #c8b89a;border-radius:12px;background:#fff}
input[type=file]{padding:14px}
button{min-height:64px;width:100%;padding:18px;font-size:1.5rem;font-weight:800;background:var(--coffee);color:#fff;border:none;border-radius:12px;margin-top:24px;cursor:pointer}
button:hover{background:#5a3e26}
.back{display:inline-block;margin-bottom:16px;font-size:1.2rem;color:var(--coffee);text-decoration:none}
.msg{display:none;padding:18px;border-radius:12px;margin-top:18px;font-size:1.2rem;font-weight:700}
.msg.ok{display:block;background:var(--green);color:#fff}
.msg.err{display:block;background:var(--red);color:#fff}
.preview{margin-top:14px;max-width:240px;border-radius:10px;border:2px solid #c8b89a;display:none}
</style>
</head>
<body>
<header class="nav"><a href="/admin/index">← 返回</a><div style="font-size:1.3rem;font-weight:800">📦 添加新商品</div></header>
<main class="wrap">
  <a class="back" href="/admin/index">← 返回后台首页</a>
  <h1>📦 添加新商品</h1>

  <form id="f">
    <label for="name">商品名</label>
    <input id="name" name="name" placeholder="例：现代轻奢单人椅" required>

    <label for="price">价格（显示用）</label>
    <input id="price" name="price" placeholder="¥1xxx 起" value="¥1xxx 起">

    <label for="size">尺寸</label>
    <input id="size" name="size" placeholder="例：0.9 米 × 0.9 米 × 0.8 米">

    <label for="category">分类</label>
    <select id="category" name="category">
      <option value="沙发">沙发</option>
      <option value="柜子">柜子</option>
      <option value="床">床</option>
      <option value="餐桌">餐桌</option>
      <option value="椅子">椅子</option>
      <option value="其他">其他</option>
    </select>

    <label for="file">商品图（jpg / png）</label>
    <input id="file" name="file" type="file" accept="image/*" required>
    <img id="preview" class="preview" alt="预览">

    <button type="submit">✅ 上传并保存</button>
  </form>

  <div id="msg" class="msg"></div>
</main>

<script>
const f=document.getElementById('f');
const msg=document.getElementById('msg');
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');

fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0];
  if(!f){preview.style.display='none';return}
  const reader=new FileReader();
  reader.onload=e=>{preview.src=e.target.result;preview.style.display='block'};
  reader.readAsDataURL(f);
});

function showMsg(text,ok){
  msg.textContent=text;
  msg.className='msg '+(ok?'ok':'err');
}

f.addEventListener('submit',async e=>{
  e.preventDefault();
  const form=new FormData();
  form.append('name',document.getElementById('name').value.trim());
  form.append('price',document.getElementById('price').value.trim());
  form.append('size',document.getElementById('size').value.trim());
  form.append('category',document.getElementById('category').value);
  const file=fileInput.files[0];
  if(!file){showMsg('请选择图片',false);return}
  form.append('file',file);
  try{
    const r=await fetch('/api/upload/product-image',{method:'POST',body:form});
    const data=await r.json();
    if(!data.success){showMsg(data.error||'上传失败',false);return}
    showMsg('✅ 上传成功：'+data.data.product.name+' · '+data.data.url,true);
    f.reset();
    preview.style.display='none';
  }catch(err){showMsg('网络出错，请重试',false)}
});

async function check(){
  const r=await fetch('/api/auth/me');
  const data=await r.json();
  if(!data.success||!data.data||!data.data.user||data.data.user.id!=='admin'){
    location.href='/admin/login';
  }
}
check();
</script>
</body>
</html>
