<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a2818">
<title>试摆历史 · 银杏家具后台</title>
<style>
:root{--ink:#1a1a1a;--paper:#faf6ef;--coffee:#3a2818;--red:#d94f3e;--green:#1f7a3a}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);padding-bottom:80px}
.nav{background:var(--coffee);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:16px}
.nav a{color:#fff;font-size:1.2rem;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px}
h1{font-size:2rem;color:var(--coffee);margin-bottom:8px}
p.lead{color:#444;margin-bottom:18px}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.toolbar input{padding:10px 14px;font-size:1rem;border:2px solid #c8b89a;border-radius:10px;background:#fff;flex:1;min-width:180px}
.toolbar .count{font-size:.95rem;color:#888}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:2px solid var(--paper);transition:border-color .15s}
.tile:hover{border-color:var(--coffee)}
.img{aspect-ratio:1/1;background:var(--coffee);overflow:hidden;cursor:zoom-in}
.img img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.meta .product{font-size:.9rem;font-weight:700;color:var(--coffee)}
.meta .phone{font-size:.85rem;color:var(--ink)}
.meta .ts{font-size:.7rem;color:#888}
.empty{padding:60px 20px;text-align:center;color:#888;font-size:1.1rem}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:300;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;background:#fff}
.lightbox .info{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;padding:14px;font-size:.85rem;text-align:center}
</style>
</head>
<body>
<header class="nav">
  <a href="/admin/index">← 返回</a>
  <div style="font-size:1.3rem;font-weight:800">🖼️ 试摆历史</div>
</header>
<main class="wrap">
  <a href="/admin/index" style="display:inline-block;margin-bottom:14px;color:var(--coffee);font-size:1.1rem;text-decoration:none">← 返回后台首页</a>
  <h1>🖼️ 试摆历史</h1>
  <p class="lead">所有 AI 合成过的效果图。点缩略图看大图，按手机号或商品 ID 筛选。</p>

  <div class="toolbar">
    <input type="text" id="filter" placeholder="按手机号 / 商品 ID / 文件名筛选">
    <span class="count" id="count"></span>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">还没有试摆历史</div>
</main>

<div id="lightbox" class="lightbox" onclick="this.classList.remove('show')">
  <img id="lb-img" alt="">
  <div class="info" id="lb-info"></div>
</div>

<script>
let results=[];
const grid=document.getElementById('grid');
const empty=document.getElementById('empty');
const count=document.getElementById('count');

async function load(){
  const r=await fetch('/api/admin/tryon-results?limit=200').then(r=>r.json());
  results=(r.data&&r.data.results)||[];
  render();
}
function render(filter=''){
  const f=filter.trim().toLowerCase();
  const list=results.filter(u=>!f||(u.userPhone||'').includes(f)||(u.productId||'').toLowerCase().includes(f)||(u.filename||'').toLowerCase().includes(f));
  count.textContent=`共 ${list.length} 张`;
  if(list.length===0){empty.style.display='block';grid.innerHTML='';return}
  empty.style.display='none';
  grid.innerHTML=list.map(u=>`
    <div class="tile" data-id="${u.id}">
      <div class="img" onclick="zoom('${u.url}','${u.userPhone||'匿名'}','${u.productId||''}','${new Date(u.createdAt).toLocaleString('zh-CN')}')">
        <img src="${u.url}" alt="合成图" onerror="this.style.display='none'">
      </div>
      <div class="meta">
        <div class="product">${u.productId||'(无商品ID)'}</div>
        <div class="phone">${u.userPhone?u.userPhone:'匿名'}</div>
        <div class="ts">${new Date(u.createdAt).toLocaleString('zh-CN')}</div>
      </div>
    </div>`).join('');
}
document.getElementById('filter').addEventListener('input',e=>render(e.target.value));

function zoom(url,phone,product,ts){
  document.getElementById('lb-img').src=url;
  document.getElementById('lb-info').textContent=`${phone} · ${product} · ${ts}`;
  document.getElementById('lightbox').classList.add('show');
}

async function check(){
  const r=await fetch('/api/auth/me');
  const data=await r.json();
  if(!data.success||!data.data||!data.data.user||data.data.user.id!=='admin'){
    location.href='/admin/login';
  }
}
check();
load();
</script>
</body>
</html>
