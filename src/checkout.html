<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下单 — 银杏家具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf6ef;
    color: #1a1a1a;
    line-height: 1.8;
    font-size: 22px;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 24px 20px; padding-bottom: 100px; }
  header {
    background: #8b4513;
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header h1 { font-size: 30px; }
  .nav-link {
    display: inline-block;
    color: #fff;
    font-size: 20px;
    margin-bottom: 12px;
    text-decoration: underline;
  }
  .summary {
    background: #fff;
    border: 2px solid #8b4513;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    font-size: 22px;
  }
  .summary h2 { font-size: 28px; color: #8b4513; margin-bottom: 12px; }
  .summary .price { color: #d2691e; font-size: 32px; font-weight: bold; }
  .step-indicator {
    display: flex;
    justify-content: space-between;
    margin: 16px 0;
    font-size: 18px;
    color: #555;
  }
  .step-indicator .active { color: #d2691e; font-weight: bold; }
  form {
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 24px 20px;
  }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #3a2818;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 16px;
    font-size: 24px;
    border: 2px solid #8b4513;
    border-radius: 8px;
    background: #fff;
    min-height: 60px;
    font-family: inherit;
  }
  .field textarea { min-height: 100px; resize: vertical; }
  .submit-btn {
    width: 100%;
    background: #d2691e;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    padding: 22px;
    border: 3px solid #8b4513;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
  }
  .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
  .msg {
    margin: 16px 0;
    padding: 16px;
    border-radius: 8px;
    font-size: 22px;
    display: none;
  }
  .msg.error { background: #ffe0e0; color: #a00; display: block; }
  .msg.success { background: #e0ffe0; color: #060; display: block; }
  .phone-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #d2691e;
    color: #fff;
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    border-top: 4px solid #8b4513;
  }
  .phone-bar a { color: #fff; text-decoration: none; }
</style>
</head>
<body>
<header>
  <a href="index.html" class="nav-link">← 返回首页</a>
  <h1>填写订单</h1>
</header>

<div class="container">
  <div class="step-indicator">
    <span class="active">第 1 步 · 填信息</span>
    <span>第 2 步 · 确认</span>
    <span>第 3 步 · 完成</span>
  </div>

  <div class="summary" id="summary">
    <h2>您选择的家具</h2>
    <p id="product-name">加载中...</p>
    <p class="price" id="product-price">¥0</p>
  </div>

  <form id="order-form">
    <div class="field">
      <label for="name">您的称呼</label>
      <input type="text" id="name" required placeholder="例如：张先生 / 李阿姨">
    </div>
    <div class="field">
      <label for="phone">手机号（必填）</label>
      <input type="tel" id="phone" required placeholder="11位手机号" pattern="^1[3-9]\d{9}$" inputmode="numeric" maxlength="11">
    </div>
    <div class="field">
      <label for="address">收货方式（必填）</label>
      <select id="address" required>
        <option value="来店自提">来店自提（柞水·农机路河西）</option>
        <option value="送货上门（柞水县城）">送货上门（柞水县城）</option>
        <option value="送货上门（商洛市区）">送货上门（商洛市区）</option>
        <option value="邮寄到省外">邮寄到省外</option>
      </select>
    </div>
    <div class="field">
      <label for="spec">规格备注</label>
      <textarea id="spec" placeholder="如有特殊尺寸、颜色要求请填写"></textarea>
    </div>
    <div id="msg" class="msg"></div>
    <button type="submit" class="submit-btn" id="submit-btn">✅ 提交订单</button>
  </form>
</div>

<div class="phone-bar">
  <a href="tel:13359140982">📞 不会填？打电话 13359140982</a>
</div>

<script>
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // 从 /checkout/sofa-1 这种 URL 中拿 productId，fallback 到查询参数
  let selectedProductId = (location.pathname.split('/').filter(Boolean).pop()) || getQueryParam('productId') || 'sofa-1';
  if (selectedProductId.endsWith('.html')) selectedProductId = getQueryParam('productId') || 'sofa-1';

  async function loadSummary() {
    try {
      const res = await fetch('/api/products/' + selectedProductId);
      if (!res.ok) throw new Error('未找到');
      const api = await res.json();
      const p = api.data ? api.data.product : api.product;
      document.getElementById('product-name').textContent = p.name + '（' + p.size + '）';
      document.getElementById('product-price').textContent = p.price;
    } catch (err) {
      document.getElementById('product-name').textContent = '请选择家具';
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  document.getElementById('order-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '提交中...';

    const payload = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      productId: selectedProductId,
      address: document.getElementById('address').value,
      spec: document.getElementById('spec').value.trim(),
      quantity: 1
    };

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const api = await res.json();
      if (!res.ok || !api.success) {
        showMsg('提交失败：' + (api.error || '未知错误'), 'error');
        btn.disabled = false;
        btn.textContent = '✅ 提交订单';
        return;
      }
      const order = api.data.order;
      window.location.href = 'order.html?id=' + order.id;
    } catch (err) {
      showMsg('网络异常，请重试或打电话 13359140982', 'error');
      btn.disabled = false;
      btn.textContent = '✅ 提交订单';
    }
  });

  loadSummary();
</script>

</body>
</html>
